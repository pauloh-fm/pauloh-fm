name: Update GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"   # diário 06:00 UTC (03:00 BRT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update coding languages block
        run: python3 .github/scripts/update-stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.workspace }}

      - name: Commit e push (se alterado)
        run: |
          if git diff --quiet README.md; then
            echo "README sem mudanças — nada a commitar"
          else
            git config user.name "pauloh-fm"
            git config user.email "phfarmar@gmail.com"
            git add README.md
            git commit -m "chore: atualiza coding languages (automático)"
            git push
          fi